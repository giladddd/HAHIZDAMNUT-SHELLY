<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a1a"/>
  <!-- Guitar body -->
  <ellipse cx="100" cy="145" rx="38" ry="42" fill="#8B4513"/>
  <ellipse cx="100" cy="115" rx="28" ry="30" fill="#8B4513"/>
  <!-- Guitar waist -->
  <rect x="72" y="120" width="56" height="18" fill="#8B4513"/>
  <!-- Sound hole -->
  <circle cx="100" cy="138" r="14" fill="#2a1a0a"/>
  <circle cx="100" cy="138" r="11" fill="#2a1a0a" stroke="#c8952a" stroke-width="2"/>
  <!-- Guitar neck -->
  <rect x="91" y="30" width="18" height="90" rx="4" fill="#6b3a10"/>
  <!-- Frets -->
  <line x1="91" y1="55" x2="109" y2="55" stroke="#d4af70" stroke-width="1.5"/>
  <line x1="91" y1="70" x2="109" y2="70" stroke="#d4af70" stroke-width="1.5"/>
  <line x1="91" y1="85" x2="109" y2="85" stroke="#d4af70" stroke-width="1.5"/>
  <line x1="91" y1="100" x2="109" y2="100" stroke="#d4af70" stroke-width="1.5"/>
  <!-- Strings -->
  <line x1="95" y1="30" x2="95" y2="158" stroke="#silver" stroke-width="1" stroke="#c0c0c0"/>
  <line x1="100" y1="30" x2="100" y2="158" stroke="#c0c0c0" stroke-width="1"/>
  <line x1="105" y1="30" x2="105" y2="158" stroke="#c0c0c0" stroke-width="1"/>
  <!-- Headstock -->
  <rect x="84" y="16" width="32" height="20" rx="4" fill="#5a2e08"/>
  <!-- Tuning pegs -->
  <circle cx="88" cy="18" r="4" fill="#d4af70"/>
  <circle cx="100" cy="18" r="4" fill="#d4af70"/>
  <circle cx="112" cy="18" r="4" fill="#d4af70"/>
  <!-- Text -->
  <text x="100" y="195" font-family="'Arial',sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">GuitarClick 🎸</text>
</svg>
